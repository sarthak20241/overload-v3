name: Deploy to app stores

# Builds a production binary for each platform and submits it to the stores.
# MANUAL ONLY: run it from the EAS dashboard or `eas workflow:run deploy.yml
# --ref <full sha>`. It no longer runs on every merge to main.
#
# Why: on the free plan the submit jobs hit the 60-minute CI/CD cap (Oct 2026),
# so every merge burned two cloud builds that never reached a store. Releases
# are now built on the Mac and submitted from the CLI instead:
#   eas build -p <android|ios> --profile production --local --output <file>
#   eas submit -p <android|ios> --profile production --path <file>
# To bring back build-on-merge, restore the `push` trigger (see git history).
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    # Track comes from eas.json submit.production.android.track, which is
    # "alpha" — the Play Developer API's id for the Closed testing track
    # (the Console's "Internal testing" is the separate `internal` id).
    name: Submit to Play Store (closed testing)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
