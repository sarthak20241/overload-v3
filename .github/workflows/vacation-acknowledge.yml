name: Vacation issue acknowledgment
on:
  issues:
    types: [opened]
permissions:
  issues: write
concurrency:
  group: vacation-ack-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  acknowledge:
    if: vars.VACATION_ISSUES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            if (now >= new Date('2026-10-09T18:30:00Z')) return;
            const marker = '<!-- overload-vacation-ack-2026 -->';
            const args = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, args);
            if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker))) return;
            await github.rest.issues.createComment({...args, body:
              `Thanks for reporting this — we’ve received your issue. It has been queued for our nightly triage and fix run, starting around 11 PM IST while the maintainer is away through October 9. We’ll post progress here or ask for more details if needed. Fixes must pass tests and review before release.\n\n${marker}`});
